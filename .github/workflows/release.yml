name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      skip_windows:
        description: Skip the Windows job
        type: boolean
        default: false
      skip_macos:
        description: Skip both macOS jobs
        type: boolean
        default: false
      skip_linux:
        description: Skip the Linux job
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    if: ${{ ! inputs.skip_windows }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
        working-directory: reasonix-migrate-tauri
      - run: pnpm tauri build
        working-directory: reasonix-migrate-tauri
      - name: Show Windows artifacts
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem `
            -Path "reasonix-migrate-tauri/src-tauri/target/release/bundle" `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
          ForEach-Object {
            Write-Host $_.FullName
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: reasonix-migrate-tauri/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  macos-x64:
    runs-on: macos-latest
    if: ${{ ! inputs.skip_macos }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - run: pnpm install --frozen-lockfile
        working-directory: reasonix-migrate-tauri
      - run: pnpm tauri build --target x86_64-apple-darwin --bundles dmg
        working-directory: reasonix-migrate-tauri
      - uses: actions/upload-artifact@v4
        with:
          name: macos-x64
          path: reasonix-migrate-tauri/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  macos-arm64:
    runs-on: macos-latest
    if: ${{ ! inputs.skip_macos }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - run: pnpm install --frozen-lockfile
        working-directory: reasonix-migrate-tauri
      - run: pnpm tauri build --target aarch64-apple-darwin --bundles dmg
        working-directory: reasonix-migrate-tauri
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: reasonix-migrate-tauri/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    if: ${{ ! inputs.skip_linux }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - run: pnpm install --frozen-lockfile
        working-directory: reasonix-migrate-tauri
      - run: pnpm tauri build --bundles appimage,deb
        working-directory: reasonix-migrate-tauri
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            reasonix-migrate-tauri/src-tauri/target/release/bundle/appimage/*.AppImage
            reasonix-migrate-tauri/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  publish:
    needs: [windows, macos-x64, macos-arm64, linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: windows
          path: artifacts/windows
      - uses: actions/download-artifact@v7
        with:
          name: macos-x64
          path: artifacts/macos-x64
      - uses: actions/download-artifact@v7
        with:
          name: macos-arm64
          path: artifacts/macos-arm64
      - uses: actions/download-artifact@v7
        with:
          name: linux
          path: artifacts/linux
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            artifacts/windows/**/*.exe
            artifacts/macos-x64/**/*.dmg
            artifacts/macos-arm64/**/*.dmg
            artifacts/linux/**/*.AppImage
            artifacts/linux/**/*.deb
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## 安装说明

            | 平台 | 文件 |
            |------|------|
            | Windows x64 | `.exe` NSIS 安装程序 |
            | macOS Intel | `.dmg` |
            | macOS Apple Silicon | `.dmg` |
            | Linux | `.AppImage` 或 `.deb` |
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
