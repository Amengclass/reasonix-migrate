name: Test Publish

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "CI Build run ID to download artifacts from"
        required: true
        type: string

jobs:
  test-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: reasonix-migrate-windows*
          path: artifacts/windows
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v7
        with:
          pattern: reasonix-migrate-macos-x64*
          path: artifacts/macos-x64
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v7
        with:
          pattern: reasonix-migrate-macos-arm64*
          path: artifacts/macos-arm64
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v7
        with:
          pattern: reasonix-migrate-linux*
          path: artifacts/linux
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Debug - show artifact structure
        run: find artifacts -type f
      - name: Publish nightly pre-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p nightly
          echo "=== Downloaded artifacts ==="
          find artifacts -type f
          cp artifacts/windows/**/*.exe nightly/reasonix-migrate-nightly_x64-setup.exe
          cp artifacts/macos-x64/**/*.dmg nightly/reasonix-migrate-nightly_x64.dmg
          cp artifacts/macos-arm64/**/*.dmg nightly/reasonix-migrate-nightly_aarch64.dmg
          cp artifacts/linux/**/*.AppImage nightly/reasonix-migrate-nightly_amd64.AppImage 2>/dev/null || true
          cp artifacts/linux/**/*.deb nightly/reasonix-migrate-nightly_amd64.deb
          echo "=== Nightly files ==="
          ls -lh nightly
          gh release delete nightly --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create nightly \
            --repo "$GITHUB_REPOSITORY" \
            --title "Nightly CI Build" \
            --notes "最新 main 分支的全平台构建（pre-release）。" \
            --prerelease \
            nightly/*
